# 자체 호스팅 서버용 (오라클 · VPS · 라즈베리파이).
# 로컬 개발은 docker-compose.yml 을 쓴다 — 이 파일은 그것의 오버라이드가 아니라 독립 구성이다.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 로컬과 다른 점 하나: 앱 포트를 인터넷에 열지 않는다.
# 바깥으로 나가는 것은 Caddy 의 80 · 443 뿐이고, 앱은 도커 내부 네트워크에만 있다.
services:
  # ./data 는 도커가 만들면 root 소유가 된다. 앱은 uid 1001 로 돌기 때문에
  # 그대로 두면 설정·비밀번호 저장이 조용히 500 으로 실패한다.
  # 매번 뜨기 전에 소유권을 맞춘다 — 새 서버에 올릴 때도 손댈 필요가 없다.
  init:
    image: alpine:3
    user: root
    command: sh -c "mkdir -p /data && chown -R 1001:1001 /data"
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: herald:prod
    container_name: herald
    expose:
      - "3000"
    env_file:
      - path: server/.env
        required: false
    volumes:
      - ./data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    # ⚠ 살아 있는지 보려고만 두는 게 아니다. Next 는 instrumentation.ts 를
    #   **첫 요청이 올 때** 실행한다 — 실제로 띄워 보고 확인했다. 그 안에서
    #   매일 요약을 돌리는 타이머가 시작되므로, 아무도 앱을 안 열면 타이머
    #   자체가 안 돈다. 이게 뜨자마자 한 번 두드려 그 구멍을 막는다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: herald-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 리포 루트 .env 에서 읽는다. 없으면 Caddy 가 뜨지 않는다 — 의도된 동작이다.
      - HERALD_DOMAIN=${HERALD_DOMAIN:?HERALD_DOMAIN 을 .env 에 설정해야 한다}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠ 발급받은 인증서가 여기 산다. 지우면 재발급이 돌고, Let's Encrypt 는
      #   주당 횟수 제한이 있어 반복하면 몇 시간~며칠 막힌다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
