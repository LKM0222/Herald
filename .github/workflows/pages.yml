name: Deploy client to GitHub Pages

# 화면(client/)만 배포한다. 서버(server/)는 따로 자체 호스팅한다.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 취소하지는 않는다 — 중간 상태로 남으면 곤란하다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # VITE_API_BASE 를 주지 않는다 — 서버 주소 기본값은 config.ts 에 있다.
      # ⛔ 토큰은 어떤 경로로도 빌드에 넣지 않는다. Pages 는 공개라
      #    번들에 들어가는 순간 누구나 꺼내 쓸 수 있다. 사용자가 브라우저에 직접 넣는다.
      - run: npm run build
        working-directory: client

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
