services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: herald:dev
    container_name: herald
    ports:
      # 이 PC엔 이미 3000을 쓰는 다른 서비스가 있다. 충돌하면 HERALD_PORT 로 바꾼다.
      - "${HERALD_PORT:-3100}:3000"
    env_file:
      # 서버 설정은 server/.env 한 군데에만 둔다 — npm run dev 도 같은 파일을 읽는다.
      - path: server/.env
        required: false
    volumes:
      # SQLite 파일. 백업은 이 폴더를 복사하면 끝난다.
      - ./data:/data
    restart: unless-stopped
